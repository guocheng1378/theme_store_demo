name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.4
          channel: stable
          cache: true
      - name: Scaffold android runner
        run: |
          flutter create --project-name theme_store_demo --org com.demo /tmp/scaffold
          cp -r /tmp/scaffold/android ./android
        shell: bash
      - name: Pub get
        run: flutter pub get
        shell: bash
      - name: Build APK (release)
        run: flutter build apk --release
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: theme_store_demo-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
